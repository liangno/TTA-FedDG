# DDP setting and logistics
world_size: 1
gpu: 1
rank: 0
port: 10000
dist_url: "tcp://localhost:${port}"
dist_backend: "nccl"
multiprocessing_distributed: false
seed: null
distributed: false  # 或者 true，根据你的需求

# Pipeline flag & memo
train_source: false
target_algorithm: "ours"
workdir: ./output
memo: sketch

sub_memo: null
project: null
use_wandb: false
train_fed: false
# Modular settings
defaults:
  - _self_
  - model_fed: basic
  - model_tta: moco
  - data: basic
  - optim: sgd
  - learn: target

# Place where all logs & cache go 
hydra:
  
  run:
    dir: ${workdir}/${data.dataset}/${memo}
  output_subdir: .hydra-${seed}